# Release smoke checks only; the full suite requires an explicit manual request.
name: Validate

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      full:
        description: Run the full offline regression suite after smoke checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CLAUDE_CODE_VERSION: 2.1.310

jobs:
  smoke:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Cache Claude Code downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: claude-cli-${{ runner.os }}-node24.22.1-${{ env.CLAUDE_CODE_VERSION }}

      - name: Install Claude Code CLI
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate release contracts
        run: bash .github/scripts/validate-release.sh

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    needs: smoke
    uses: ./.github/workflows/tests.yml
