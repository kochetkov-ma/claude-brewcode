# Creates a GitHub Release on any pushed v*.*.* tag (branch-agnostic).
# Body = the tag's RELEASE-NOTES.md section + install instructions.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: RELEASE-NOTES.md

      - name: Extract changelog for tag version
        id: changelog
        run: |
          # Strip "v" prefix from tag to get version number (e.g. v2.15.4 -> 2.15.4)
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="RELEASE-NOTES.md"

          if [ ! -f "$RELEASE_NOTES" ]; then
            echo "::error::${RELEASE_NOTES} not found"
            exit 1
          fi

          # Section = header `## [VER]`, `## vVER` or `## VER` up to the next version header or `---`.
          # Stop regex keeps `\[`: legacy `## [x.y.z]` headers follow the oldest `## v` section.
          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            # Match header: ## [2.15.4], ## v2.15.4, or ## 2.15.4
            $0 ~ "^## (\\[" ver "\\]|v?" ver ")([^0-9.]|$)" {
              found=1
              print
              next
            }
            # Stop at next version header (any of the three formats) or --- separator
            found && $0 ~ "^## (\\[|v?[0-9])" { exit }
            found && /^---[[:space:]]*$/ { exit }
            found { print }
          ' "$RELEASE_NOTES")

          if [ -z "$BODY" ]; then
            echo "::error::No changelog section found for version ${VERSION} in ${RELEASE_NOTES}"
            exit 1
          fi

          # Write changelog to the per-job private RUNNER_TEMP dir
          echo "$BODY" > "$RUNNER_TEMP/release-body.md"

          # Append install instructions (backticks are literal Markdown fences)
          # shellcheck disable=SC2016
          printf '\n---\n\n## Quick Install\n\n```bash\n# 1. Add marketplace (one-time)\nclaude plugin marketplace add https://github.com/kochetkov-ma/claude-brewcode\n\n# 2. Install plugins\nclaude plugin install brewcode@claude-brewcode\nclaude plugin install brewdoc@claude-brewcode\nclaude plugin install brewtools@claude-brewcode\n```\n\n## Already installed? Update\n\n```bash\nclaude plugin marketplace update claude-brewcode\nclaude plugin update brewcode@claude-brewcode\nclaude plugin update brewdoc@claude-brewcode\nclaude plugin update brewtools@claude-brewcode\n```\n' >> "$RUNNER_TEMP/release-body.md"

          echo "Release body written to $RUNNER_TEMP/release-body.md"
          echo "--- Preview (first 20 lines) ---"
          head -20 "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          prerelease: false
