# Release tags publish docs; manual runs build and verify without publishing or deploying.

name: Docs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kochetkov-ma/claude-brewcode-docs
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            web/docs
            assets/demos
            brewcode/.claude-plugin/plugin.json

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Build provenance validation failed"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only a release tag publishes docs"; exit 1; }
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION=$(node -p "require('./brewcode/.claude-plugin/plugin.json').version")
            VERSION="${BASE_VERSION}-manual-${GITHUB_RUN_ID}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9._-]+)?$ && ${#VERSION} -le 128 ]] || { echo "::error::Build provenance validation failed"; exit 1; }
          printf 'tags=%s:%s,%s:sha-%s-%s-%s\nversion=%s\nsha=%s\n' \
            "$IMAGE" "$VERSION" "$IMAGE" "$SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VERSION" "$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p web/docs/public
          printf '{"version":"%s","sha":"%s","buildRunId":"%s"}\n' \
            "$VERSION" "$SHA" "$GITHUB_RUN_ID" > web/docs/public/build-info.json

      - name: Stage demo GIFs into the build context
        run: |
          mkdir -p web/docs/public/demos
          cp assets/demos/*.gif web/docs/public/demos/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs image
        uses: docker/build-push-action@v7.4.0
        with:
          context: web/docs
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            io.brewcode.docs.build-run-id=${{ github.run_id }}
            io.brewcode.docs.build-attempt=${{ github.run_attempt }}
          # Lockfile-keyed registry cache is shared across release refs; manual runs only read it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ hashFiles('web/docs/package-lock.json') }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE, hashFiles('web/docs/package-lock.json')) || '' }}

      - name: Verify manual image
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}:${VERSION}"
          EXPECTED_INFO=$(printf '{"version":"%s","sha":"%s","buildRunId":"%s"}' "$VERSION" "$BUILD_SHA" "$GITHUB_RUN_ID")
          [[ "$(docker run --rm --entrypoint cat "$IMAGE_REF" /srv/build-info.json)" == "$EXPECTED_INFO" ]] || { echo "::error::Built image metadata mismatch"; exit 1; }
          docker run --rm --entrypoint sh "$IMAGE_REF" -ec 'test -s /srv/getting-started/index.html; caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            if [[ "$EVENT_NAME" == push ]]; then echo "### Docs image published"; else echo "### Docs image verified (build only)"; fi
            echo ""
            echo "**Version:** \`${VERSION}\` / **SHA:** \`${BUILD_SHA}\` / **Build run:** $GITHUB_RUN_ID"
            echo ""
            echo "**Tags:**"
            IFS=',' read -ra TAG_LIST <<< "$TAGS"
            for tag in "${TAG_LIST[@]}"; do
              echo "- \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
