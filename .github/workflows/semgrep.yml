name: Semgrep

on:
  push:
    branches: [ main ]
    tags-ignore:
      - "v*.*.*"
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Official CLI image (semgrep-action is archived); scan never fails on findings, they go to code scanning
      - name: Semgrep scan
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" semgrep/semgrep:1.180.0
          semgrep scan --config p/javascript --config p/secrets --metrics=off
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && ICON="✅" || ICON="❌"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ${ICON} Semgrep — SAST"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | **${STATUS}** |"
            echo "| Rules | \`p/javascript\`, \`p/secrets\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
            echo "📄 [Download SARIF report](${RUN_URL}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
