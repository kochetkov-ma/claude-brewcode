name: Gitleaks

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tag push payloads may contain no commits; the event-based Action silently skips those scans.
      - name: Scan Git history
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --exit-code=2 --report-format=sarif --report-path=results.sarif
      - uses: github/codeql-action/upload-sarif@v4.39.1
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
      - uses: actions/upload-artifact@v7.0.2
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: gitleaks-sarif
          path: results.sarif
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && ICON="✅" || ICON="❌"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ${ICON} Gitleaks — Secrets Scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | **${STATUS}** |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
            echo "📄 [Download SARIF report](${RUN_URL}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
