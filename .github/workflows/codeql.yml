name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          output: codeql-results

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && ICON="✅" || ICON="❌"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ${ICON} CodeQL — Static Analysis"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | **${STATUS}** |"
            echo "| Language | \`javascript\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
            echo "📄 [Download SARIF report](${RUN_URL}#artifacts) — open the run page and scroll to **Artifacts**"
          } >> "$GITHUB_STEP_SUMMARY"
