services:
  docs:
    # DOCS_VERSION = exact release tag; unset -> pull fails (no floating default).
    image: ghcr.io/kochetkov-ma/claude-brewcode-docs:${DOCS_VERSION}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
